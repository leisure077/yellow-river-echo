<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5EFE4">
<title>3D工坊</title>
<style>
  :root{
    --paper:#F5EFE4; --paper-hi:#FFFCF5; --ink:#2B2622; --sub:#7A6E62;
    --clay:#A6553D; --line:#E5DAC6; --gold:#C8A160;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"HarmonyOS Sans SC","PingFang SC",sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  header{
    flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:rgba(245,239,228,.94);border-bottom:1px solid var(--line);z-index:10;
  }
  header h1{
    flex:1;min-width:0;margin:0;text-align:center;font:600 17px/1 Georgia,"Songti SC","STSong",serif;
    letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .iconBtn{
    flex:0 0 auto;
    width:36px;height:36px;border-radius:18px;border:1px solid var(--line);
    background:rgba(255,255,255,.72);display:grid;place-items:center;
    font-size:22px;line-height:1;color:var(--ink);transition:transform .15s ease;
  }
  .iconBtn:active{transform:scale(.94)}
  .iconBtn.pill{width:auto;padding:0 12px;font-size:11px;letter-spacing:1px;color:var(--sub)}
  main{
    position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    background:radial-gradient(120% 92% at 50% 38%,#FFFDF8 0%,#F7F1E6 44%,#EDE2CF 100%);
  }
  main::before{
    content:"";position:absolute;left:50%;top:54%;width:min(80vw,360px);height:min(80vw,360px);
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(255,255,255,.72) 0%,rgba(255,255,255,0) 68%);
  }
  /* 关键：这层柔光必须压在模型下面。canvas 是 static 元素，会被定位的 ::before 盖住，
     在深色釉面上就是一层抹不掉的“白雾” */
  #stage canvas{display:block;position:relative;z-index:1;width:100%;height:100%;touch-action:none}
  #still{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:contain;display:block;touch-action:none;transform-origin:50% 50%;user-select:none;-webkit-user-drag:none}
  #still[hidden]{display:none}
  #stillBadge{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;
    padding:5px 12px;border-radius:13px;border:1px solid var(--line);
    background:rgba(255,252,245,.84);color:var(--sub);font-size:10.5px;letter-spacing:1px;
    white-space:nowrap;pointer-events:none;
  }
  #stillBadge[hidden]{display:none}
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:4;
    width:38px;height:38px;border-radius:19px;border:1px solid var(--line);
    background:rgba(255,252,245,.82);color:var(--sub);font-size:20px;line-height:1;
    display:grid;place-items:center;box-shadow:0 2px 10px rgba(60,40,20,.06);
    transition:transform .15s ease,background .15s ease;
  }
  .arrow:active{transform:translateY(-50%) scale(.94);background:#fff}
  #prev{left:8px}
  #next{right:8px}
  #hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;
    padding:5px 12px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,252,245,.78);color:var(--sub);font-size:12px;letter-spacing:1px;
    opacity:0;transition:opacity .5s ease;pointer-events:none;white-space:nowrap;
  }
  #hint.show{opacity:1}
  #loading{
    position:absolute;inset:0;z-index:6;display:grid;place-items:center;
    background:rgba(245,239,228,.88);transition:opacity .3s ease,visibility .3s ease;
  }
  #loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .loadBox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;text-align:center}
  #loadText{margin:0;font-size:13px;color:var(--sub);letter-spacing:1px}
  #loading.error #loadText{color:var(--clay)}
  #loading.error .spinner{display:none}
  .spinner{
    width:28px;height:28px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--clay);animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #retry{
    padding:8px 18px;border-radius:18px;background:var(--clay);color:#fff;
    font-size:12px;letter-spacing:1px;
  }
  footer{
    flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(255,252,245,.88) 0%,var(--paper-hi) 34%);
    border-top:1px solid var(--line);z-index:10;
  }
  .titleRow{display:flex;align-items:baseline;gap:8px}
  .titleRow h2{
    margin:0;font:600 19px/1.3 Georgia,"Songti SC","STSong",serif;letter-spacing:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .era{
    flex:0 0 auto;padding:1px 9px;border:1px solid rgba(166,85,61,.42);border-radius:11px;
    color:var(--clay);font-size:12px;letter-spacing:1px;line-height:1.6;
  }
  .count{margin-left:auto;flex:0 0 auto;color:var(--gold);font-size:12.5px;letter-spacing:1px}
  /* 主题标签：压在信息条最上方，给六件文物一条体系线；底色半透明，不抢釉色 */
  .themeRow{display:flex;margin:0 0 6px}
  .theme{
    display:inline-block;padding:2px 12px;border-radius:12px;
    background:rgba(166,85,61,.13);border:1px solid rgba(166,85,61,.20);
    color:var(--clay);font-size:12px;letter-spacing:1.6px;line-height:1.6;
  }
  .theme[hidden]{display:none}
  .note{
    margin:6px 0 0;color:var(--sub);font-size:14px;line-height:1.6;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }
  .scope{
    margin:5px 0 0;color:var(--clay);font-size:12.5px;line-height:1.5;letter-spacing:.4px;
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;
    color:var(--sub);font-size:12.5px;letter-spacing:.5px;
  }
  .meta span+span::before{content:"·";margin-right:12px;color:var(--line)}
  .credit{
    margin:6px 0 0;color:#9A8C7C;font-size:11.5px;line-height:1.45;letter-spacing:.2px;
  }
  @media (max-width:380px){
    header h1{font-size:15px;letter-spacing:2px}
    .titleRow h2{font-size:17.5px}
    .note{font-size:13px}
    .scope,.meta{font-size:11.5px}
    .credit{font-size:11px}
    footer{padding-left:14px;padding-right:14px}
    .arrow{width:34px;height:34px;border-radius:17px}
    .arrow{font-size:18px}
  }
  @media (max-height:640px){
    .note{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .spinner{animation:none}
    .arrow,.iconBtn{transition:none}
  }
</style>
</head>
<body>
  <header>
    <button class="iconBtn" id="back" aria-label="返回">‹</button>
    <h1>3D工坊</h1>
    <button class="iconBtn pill" id="reset" aria-label="复位视角">复位</button>
  </header>

  <main id="stage">
    <img id="still" alt="" hidden>
    <div id="stillBadge" hidden>本机未启用 3D 渲染 · 先看静帧</div>
    <div id="loading">
      <div class="loadBox">
        <span class="spinner" aria-hidden="true"></span>
        <p id="loadText">正在调取文物…</p>
        <button id="retry" hidden>重试</button>
      </div>
    </div>
    <button class="arrow" id="prev" aria-label="上一件">‹</button>
    <button class="arrow" id="next" aria-label="下一件">›</button>
    <div id="hint">拖动旋转 · 双指缩放</div>
  </main>

  <footer>
    <div class="themeRow"><span class="theme" id="theme">丝路交融</span></div>
    <div class="titleRow">
      <h2 id="name">修定寺塔舞者砖</h2>
      <span class="era" id="era">唐</span>
      <span class="count" id="count">1 / 6</span>
    </div>
    <p class="note" id="note"></p>
    <p class="scope" id="scope"></p>
    <div class="meta">
      <span id="material"></span>
      <span id="collection"></span>
    </div>
    <p class="credit" id="credit"></p>
  </footer>

  <script type="module" src="relic.js"></script>
</body>
</html>
